<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<title>SSD Drive Sync</title>
<style>
  :root {
    --fond: #fff6f1; --fond-2: #ffece6; --carte: #ffffff; --texte: #2e2333; --doux: #8f7c84; --trait: #f1e2dc;
    --rose: #ff7f98; --rose-fonce: #ec5577; --rose-pale: #ffe4ea; --prune: #4a3758;
    --vert: #3fb489; --vert-pale: #dff5ec; --jaune: #f2b73f; --jaune-pale: #fdf1d6; --rouge: #e5534b; --rouge-pale: #fbe3e1;
    --ombre: 0 1px 2px rgba(74, 55, 88, .06), 0 8px 24px rgba(236, 85, 119, .10);
    --ombre-forte: 0 2px 4px rgba(74, 55, 88, .08), 0 18px 40px rgba(236, 85, 119, .18);
    --rayon: 20px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --fond: #1c1621; --fond-2: #241c2a; --carte: #2a2131; --texte: #f6eef2; --doux: #a8949f; --trait: #3a2f41;
      --rose-pale: #4a2533; --vert-pale: #1f3a30; --jaune-pale: #3d321a; --rouge-pale: #44231f; --prune: #e7d9f0;
      --ombre: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .25);
      --ombre-forte: 0 2px 4px rgba(0, 0, 0, .35), 0 18px 40px rgba(0, 0, 0, .35);
    }
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    font-family: "Segoe UI Variable Text", "Segoe UI", -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    background: radial-gradient(120% 70% at 50% -10%, var(--fond-2), var(--fond) 60%);
    color: var(--texte); padding: 22px 22px 14px; display: flex; flex-direction: column;
    user-select: none; -webkit-font-smoothing: antialiased; font-size: 14px; overflow: hidden;
  }
  svg.i { width: 18px; height: 18px; flex: none; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  /* En-tête */
  header { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
  header img { width: 44px; height: 44px; filter: drop-shadow(0 4px 10px rgba(236, 85, 119, .25)); }
  header h1 { font-size: 18px; font-weight: 700; letter-spacing: -.01em; }
  .puce { display: inline-flex; align-items: center; gap: 5px; margin-top: 2px; font-size: 12px; color: var(--doux);
    max-width: 290px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .puce .point { width: 7px; height: 7px; border-radius: 50%; background: var(--vert); box-shadow: 0 0 0 3px var(--vert-pale); flex: none; }

  /* Écrans */
  #ecran { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  .carte { background: var(--carte); border-radius: var(--rayon); padding: 26px 24px; box-shadow: var(--ombre); text-align: center; }
  .entre { animation: entre .38s cubic-bezier(.2, .9, .3, 1.2); }
  @keyframes entre { from { opacity: 0; transform: translateY(10px) scale(.98); } }
  .illus { width: 112px; height: 112px; margin: 0 auto 16px; display: grid; place-items: center; border-radius: 32px; background: var(--rose-pale); color: var(--rose-fonce); position: relative; }
  .illus svg.i { width: 52px; height: 52px; stroke-width: 1.7; }
  .illus.vert { background: var(--vert-pale); color: var(--vert); }
  .titre { font-weight: 700; font-size: 17px; letter-spacing: -.01em; margin-bottom: 6px; }
  .texte { color: var(--doux); line-height: 1.5; }
  .flotte { animation: flotte 2.6s ease-in-out infinite; }
  @keyframes flotte { 50% { transform: translateY(-6px); } }
  .onde::before, .onde::after { content: ""; position: absolute; inset: 0; border-radius: 32px; border: 2px solid var(--rose); opacity: 0; animation: onde 2.2s ease-out infinite; }
  .onde::after { animation-delay: 1.1s; }
  @keyframes onde { from { opacity: .5; transform: scale(1); } to { opacity: 0; transform: scale(1.45); } }
  .points { display: inline-flex; gap: 5px; margin-top: 14px; }
  .points i { width: 7px; height: 7px; border-radius: 50%; background: var(--rose); animation: point 1.2s ease-in-out infinite; }
  .points i:nth-child(2) { animation-delay: .15s; } .points i:nth-child(3) { animation-delay: .3s; }
  @keyframes point { 0%, 80%, 100% { opacity: .25; transform: scale(.8); } 40% { opacity: 1; transform: scale(1); } }
  .anneau { width: 64px; height: 64px; margin: 6px auto 18px; border-radius: 50%; border: 5px solid var(--rose-pale); border-top-color: var(--rose); animation: tourne .9s linear infinite; }
  @keyframes tourne { to { transform: rotate(360deg); } }
  .coche path { stroke-dasharray: 60; stroke-dashoffset: 60; animation: trace .5s .15s ease-out forwards; }
  @keyframes trace { to { stroke-dashoffset: 0; } }

  /* Champs et boutons */
  input { font: inherit; width: 100%; border: 1.5px solid var(--trait); border-radius: 14px; padding: 12px 14px; margin-top: 12px;
    outline: none; background: var(--fond); color: var(--texte); user-select: text; transition: border-color .2s, box-shadow .2s; }
  input:focus { border-color: var(--rose); box-shadow: 0 0 0 4px var(--rose-pale); }
  #ecran > .carte { overflow-y: auto; min-height: 0; }
  .bloc { text-align: left; background: var(--fond-2); border-radius: 14px; padding: 10px 12px; margin-top: 12px; font-size: 12.5px; line-height: 1.45; }
  .bloc b { display: block; font-size: 12px; margin-bottom: 3px; }
  .bloc .extrait { white-space: pre-line; color: var(--doux); display: -webkit-box; -webkit-line-clamp: 5; -webkit-box-orient: vertical; overflow: hidden; }
  .bloc button.lien { padding: 6px 0 0; font-size: 12.5px; }
  .actions { display: flex; flex-direction: column; gap: 9px; margin-top: 20px; }
  button { font: inherit; font-weight: 600; border: 0; border-radius: 14px; padding: 13px 18px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 9px; color: #fff;
    background: linear-gradient(180deg, var(--rose), var(--rose-fonce)); box-shadow: 0 6px 16px rgba(236, 85, 119, .3);
    transition: transform .12s, box-shadow .2s, filter .2s; }
  button:hover { filter: brightness(1.05); box-shadow: 0 8px 22px rgba(236, 85, 119, .38); }
  button:active { transform: scale(.98); }
  button.second { background: var(--fond-2); color: var(--texte); box-shadow: none; }
  button.second:hover { background: var(--trait); }
  button.lien { background: none; box-shadow: none; color: var(--doux); font-weight: 500; font-size: 12.5px; padding: 8px 10px; }
  button.lien:hover { color: var(--texte); }
  button.lien svg.i { width: 15px; height: 15px; }

  /* Stats */
  .jauge { height: 10px; background: var(--fond-2); border-radius: 99px; overflow: hidden; margin: 18px 0 8px; }
  .jauge div { height: 100%; border-radius: 99px; transition: width .8s cubic-bezier(.2, .8, .2, 1); }
  .stats { display: flex; justify-content: space-between; font-size: 12.5px; color: var(--doux); }
  .stats b { color: var(--texte); font-weight: 600; }

  /* Liste des disques */
  .liste-tete { display: flex; justify-content: space-between; align-items: baseline; margin: 0 4px 10px; }
  .liste-tete b { font-size: 15px; } .liste-tete span { font-size: 12px; color: var(--doux); }
  .choix { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 9px; padding: 2px 4px 10px; margin: 0 -4px; }
  .choix::-webkit-scrollbar { width: 6px; } .choix::-webkit-scrollbar-thumb { background: var(--trait); border-radius: 9px; }
  .disque { all: unset; box-sizing: border-box; cursor: pointer; display: grid; grid-template-columns: 42px 1fr auto; gap: 12px; align-items: center;
    background: var(--carte); border-radius: 16px; padding: 12px 14px; box-shadow: var(--ombre); transition: transform .15s, box-shadow .2s; }
  .disque:hover { transform: translateY(-1px); box-shadow: var(--ombre-forte); }
  .disque:focus-visible { outline: 2px solid var(--rose); outline-offset: 2px; }
  .num { width: 42px; height: 42px; border-radius: 13px; background: var(--rose-pale); color: var(--rose-fonce); display: grid; place-items: center; font-weight: 800; font-size: 16px; }
  .disque .nom { font-weight: 650; display: flex; align-items: center; gap: 6px; }
  .disque .sous { font-size: 12px; color: var(--doux); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .relie { width: 7px; height: 7px; border-radius: 50%; background: var(--vert); box-shadow: 0 0 0 3px var(--vert-pale); }
  .pct { font-size: 12px; font-weight: 700; padding: 4px 8px; border-radius: 99px; }
  .mini { grid-column: 2 / 4; height: 5px; background: var(--fond-2); border-radius: 9px; overflow: hidden; margin-top: -4px; }
  .mini div { height: 100%; border-radius: 9px; }
  .ajout { display: flex; align-items: center; gap: 12px; padding: 14px; border: 1.5px dashed var(--rose); background: transparent; box-shadow: none; color: var(--rose-fonce); grid-template-columns: none; }
  .ajout:hover { background: var(--rose-pale); box-shadow: none; }
  .ajout .num { background: var(--rose); color: #fff; }

  .alerte { display: flex; gap: 10px; align-items: flex-start; background: var(--jaune-pale); color: #8a5d06; border-radius: 14px;
    padding: 11px 13px; margin: 0 0 10px; font-size: 12.5px; line-height: 1.45; }
  .alerte b { display: block; font-size: 13px; }
  .maj { align-items: center; margin: 0 0 12px; }
  .maj span { flex: 1; }
  .maj button { padding: 8px 14px; font-size: 12.5px; white-space: nowrap; }
  .alerte svg.i { margin-top: 1px; }
  .badge-double { font-size: 10.5px; font-weight: 700; color: #8a5d06; background: var(--jaune-pale); padding: 2px 7px; border-radius: 99px; }
  .disque.double { box-shadow: 0 0 0 1.5px var(--jaune), var(--ombre); }
  .liste-tete span { display: inline-flex; align-items: center; gap: 8px; }
  button.recharger { background: var(--carte); color: var(--rose-fonce); box-shadow: var(--ombre); padding: 5px 10px; font-size: 12px; border-radius: 99px; gap: 5px; }
  button.recharger:hover { background: var(--rose-pale); }
  button.recharger svg.i { width: 13px; height: 13px; }
  button.recharger.en-cours svg.i { animation: tourne .8s linear infinite; }
  .rappel { display: inline-block; font-size: 12.5px; font-weight: 600; color: var(--texte); background: var(--fond-2);
    padding: 6px 12px; border-radius: 99px; margin: 2px 0 8px; max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .illus.orange { background: var(--jaune-pale); color: #b07a0d; }
  @media (prefers-color-scheme: dark) { .alerte, .badge-double { color: #f2c86a; } }
  .erreur { color: var(--rouge); font-size: 12.5px; text-align: center; min-height: 18px; margin-top: 10px; }
  footer { display: flex; justify-content: center; gap: 0; padding-top: 6px; }
  footer button.lien { white-space: nowrap; padding: 8px 5px; font-size: 12px; }
  .cache { display: none !important; }
</style>
</head>
<body>
  <header>
    <img src="../build/logo.svg" alt="">
    <div>
      <h1>SSD Drive Sync</h1>
      <div class="puce" id="puce"><span>Le carnet des disques se remplit tout seul</span></div>
    </div>
  </header>

  <div class="alerte maj cache" id="maj"></div>
  <main id="ecran"></main>
  <p class="erreur" id="erreur"></p>

  <footer class="cache" id="bas">
    <button class="lien" id="btn-ouvrir"></button>
    <button class="lien" id="btn-changer"></button>
    <button class="lien" id="btn-cle"></button>
  </footer>

<script>
// Icônes dessinées (trait 24 px), nettes à toutes les tailles.
const ICONES = {
  google: '<path d="M21 12.2c0-.7-.1-1.3-.2-1.9H12v3.6h5a4.3 4.3 0 0 1-1.9 2.8v2.3h3A9 9 0 0 0 21 12.2Z"/><path d="M12 21a9 9 0 0 0 6.1-2.2l-3-2.3a5.4 5.4 0 0 1-8-2.8H4v2.4A9 9 0 0 0 12 21Z"/><path d="M7.1 13.7a5.4 5.4 0 0 1 0-3.4V7.9H4a9 9 0 0 0 0 8.2l3.1-2.4Z"/><path d="M12 6.6c1.4 0 2.6.5 3.6 1.4l2.6-2.6A9 9 0 0 0 4 7.9l3.1 2.4A5.4 5.4 0 0 1 12 6.6Z"/>',
  lien: '<path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/>',
  cle: '<circle cx="7.5" cy="15.5" r="4.5"/><path d="m10.7 12.3 9.8-9.8M17 6l3 3M14.5 8.5l2.5 2.5"/>',
  prise: '<path d="M9 2v5M15 2v5"/><path d="M6 7h12v4a6 6 0 0 1-12 0V7Z"/><path d="M12 17v5"/>',
  disque: '<rect x="3" y="4" width="18" height="16" rx="4"/><path d="M7 9h6"/><circle cx="16.5" cy="15.5" r="1.3" fill="currentColor"/>',
  sync: '<path d="M20 11a8 8 0 0 0-14.3-4.9L4 8"/><path d="M4 3v5h5"/><path d="M4 13a8 8 0 0 0 14.3 4.9L20 16"/><path d="M20 21v-5h-5"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
  retour: '<path d="M19 12H5M11 18l-6-6 6-6"/>',
  fichier: '<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8l-5-5Z"/><path d="M14 3v5h5M9 13h6M9 17h4"/>',
  reglage: '<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/>',
  coche: '<path d="M5 12.5l4.5 4.5L19 7.5"/>',
  nouveau: '<rect x="3" y="4" width="18" height="16" rx="4"/><path d="M12 9v6M9 12h6"/>',
  question: '<circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .8-1 1.5v.4"/><circle cx="12" cy="17" r=".6" fill="currentColor"/>',
};
const ico = (nom, classe = '') => `<svg class="i ${classe}" viewBox="0 0 24 24">${ICONES[nom]}</svg>`;

// Hors de l'app (aperçu dans un navigateur), une fausse API permet de voir chaque écran.
if (!window.app) {
  const faux = [
    { numero: '1', capacite: '2', pourcent: '82,5', localisation: 'TOM', projets: 'IFIS', relie: true, ligne: 1 },
    { numero: '2', capacite: '2', pourcent: '96', localisation: 'Fantasmagorie > Salon', projets: 'CreativGen', relie: true, ligne: 2 },
    { numero: '3', capacite: '2', pourcent: '94', localisation: 'Fantasmagorie > Salon', projets: 'PB Noël', relie: false, doublon: true, ligne: 3 },
    { numero: '3', capacite: '2', pourcent: '79', localisation: 'TOM', projets: 'IFIS', relie: false, doublon: true, ligne: 4 },
    { numero: '5', capacite: '1', pourcent: '56,6', localisation: 'TOM', projets: 'Hypnos', relie: false, ligne: 5 },
  ];
  const ssd = { disque: { modele: 'Samsung T7 Shield 2 To', total_to: 2, utilise_to: 1.42, restant_to: 0.58, pourcent: 71 }, numero: null };
  const attendre = (ms) => new Promise((ok) => setTimeout(ok, ms));
  window.app = {
    etatInitial: async () => ({ connecte: true, sheetId: 'x', titre: 'LES DISQUES DURS', nom: 'Anne', cleOpenai: true }),
    disques: async () => { await attendre(300); return faux; },
    attendre: async () => { setTimeout(() => window.__ssd && window.__ssd(ssd), 2500); return null; },
    liberer: async () => {},
    synchroniser: async (n) => {
      for (const m of ['Je lis tous les dossiers du SSD…', '12 500 fichiers lus…', 'Je résume le contenu…', 'Je cherche les doublons…']) { window.__progres?.(m); await attendre(600); }
      return { numero: n, ecrits: ['Capacité (En To)', 'Utilisé', 'Restant', '%', 'Projets'], analyse: {
        fichiers: 12873,
        contenu: { texte: 'CLIP LUMIÈRE : - Rush A7SIII - Son - Export\nPUB MAISON VERTE : - Montage - Photos', ecrit: false, actuel: 'Écrit à la main par Anne' },
        doublons: { memeSsd: 2, autresSsd: 5, perduGo: 38.4, avec: ['4', '7'], total: 12 },
      } };
    },
    changerNumero: async (ligne, ancien, n) => { await attendre(400); faux.find((x) => x.ligne === ligne && x.numero === ancien).numero = n; return n; },
    cleOpenai: async (k) => { await attendre(800); if (k !== 'sk-bonne-cle-de-test') throw new Error('OpenAI refuse cette clé : elle est fausse, expirée ou supprimée'); },
    ecrireContenu: async () => attendre(400), ouvrirDoublons: async () => {}, surProgres: (fn) => { window.__progres = fn; }, surDeconnexion: (fn) => { window.__deco = fn; },
    majEtat: async () => null, majInstaller: async () => {}, surMaj: (fn) => { window.__maj = fn; },
    verifier: async (n) => (n === '1' ? { autre: { modele: 'SanDisk Extreme 2 To', date: '03/11/2026' }, ecart: null }
      : n === '2' ? { autre: null, ecart: { fichier: 4, mesure: 2 } } : { autre: null, ecart: null }),
    renumeroter: async (ligne) => { const d = faux.find((x) => x.ligne === ligne); d.numero = '6'; faux.forEach((x) => { x.doublon = false; }); return '6'; },
    ajouter: async (c = {}) => { await attendre(1200); return { numero: c.numero || '37', ecrits: ['Capacité (En To)', 'Utilisé', 'Restant', '%', 'Projets'], deplace: c.prendre ? { de: c.numero, vers: '37' } : null }; },
    // window.__prop permet de tester chaque cas : pas de n°, n° libre, ligne sans SSD, n° pris par un autre SSD.
    proposition: async () => window.__prop || { nom: 'SSD 12', suite: '37', numeroNom: '12', occupant: null },
    ouvrirFichier: async () => {}, changerFichier: async () => {}, connecter: async () => {}, choisirFichier: async () => 'X', nom: async () => {},
    surSsd: (fn) => { window.__ssd = fn; }, surRetrait: () => {}, surErreur: () => {},
  };
}

const $ = (id) => document.getElementById(id);
const ecran = $('ecran');
let etat = {};
let vue = null;   // écran affiché : 'liste', 'attente', 'pret', 'nouveau', 'travail'…
let cible = null; // n° du disque attendu, ou 'nouveau'

const echapper = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const erreur = (m) => { $('erreur').textContent = m ? String(m).replace(/^.*Error: /, '') : ''; };

// Mêmes seuils de couleur que le fichier d'Anne : vert < 70 %, jaune 70–90 %, rouge > 90 %.
const teinte = (p) => {
  const n = parseFloat(String(p).replace(',', '.'));
  if (Number.isNaN(n)) return ['var(--trait)', 'var(--fond-2)', 'var(--doux)'];
  if (n > 90) return ['var(--rouge)', 'var(--rouge-pale)', 'var(--rouge)'];
  if (n >= 70) return ['var(--jaune)', 'var(--jaune-pale)', '#a8740f'];
  return ['var(--vert)', 'var(--vert-pale)', 'var(--vert)'];
};

function afficher(nom, html, carte = true) {
  vue = nom;
  ecran.innerHTML = carte ? `<div class="carte entre">${html}</div>` : `<div class="entre" style="display:flex;flex-direction:column;min-height:0;flex:1">${html}</div>`;
  erreur('');
}

const boutons = (liste) => `<div class="actions">${liste.map(([id, icone, texte, classe]) =>
  `<button id="${id}" class="${classe || ''}">${icone ? ico(icone) : ''}${texte}</button>`).join('')}</div>`;

const illus = (icone, classe = '') => `<div class="illus ${classe}">${ico(icone)}</div>`;

const stats = (d) => `<div class="jauge"><div style="width:${d.pourcent}%;background:${teinte(d.pourcent)[0]}"></div></div>
  <div class="stats"><span><b>${fr(d.utilise_to)} To</b> utilisés</span><span><b>${fr(d.restant_to)} To</b> libres · ${fr(d.pourcent)} %</span></div>`;
const fr = (n) => String(n).replace('.', ',');

// ---------- Réglages (une seule fois) ----------

// Toujours joignable : au premier lancement, quand Google a coupé la connexion, ou pour changer de compte.
function ecranConnexion() {
  $('bas').classList.add('cache');
  const deja = etat.connecte && etat.sheetId; // simple changement de compte : on peut revenir
  afficher('reglage', `${illus('google')}
    <p class="titre">${etat.sheetId ? 'Connexion à Google' : 'Bienvenue'}</p>
    <p class="texte">Connecte ton compte Google pour relier l'app à ton fichier des disques.</p>
    ${boutons([['go', 'google', 'Se connecter avec Google'], ...(deja ? [['retour', 'retour', 'Retour à la liste', 'second']] : [])])}
    <p class="texte" style="font-size:12px;margin-top:10px">La page de connexion s'ouvre dans ton navigateur. Si rien ne s'ouvre ou si tu l'as fermée, clique à nouveau.</p>`);
  $('go').onclick = async () => {
    $('go').lastChild.textContent = 'Regarde ton navigateur…';
    erreur('');
    try { await window.app.connecter(); etat.connecte = true; suivant(); }
    catch (e) { if ($('go')) $('go').lastChild.textContent = 'Se connecter avec Google'; erreur(e.message); }
  };
  if (deja) $('retour').onclick = ecranListe;
}

// Nouvelle version de l'app : prête à installer (Windows) ou à télécharger (Mac).
function afficherMaj(info) {
  if (!info) return;
  const b = $('maj');
  b.innerHTML = `${ico('sync')}<span><b>Nouvelle version ${echapper(info.version)} disponible</b>${info.prete
    ? 'Elle est déjà téléchargée.'
    : 'Ouvre le fichier téléchargé et glisse l’app dans Applications.'}</span><button id="btn-maj">${info.prete ? 'Redémarrer' : 'MAJ'}</button>`;
  b.classList.remove('cache');
  $('btn-maj').onclick = async () => {
    const bouton = $('btn-maj');
    if (info.prete) { bouton.disabled = true; bouton.textContent = 'Installation…'; }
    const r = await window.app.majInstaller();
    // Mac : remplacement impossible, le .dmg se télécharge à la place ; on le dit.
    if (r && r.erreur) { erreur(r.erreur); bouton.disabled = false; bouton.textContent = 'Réessayer'; }
  };
}
window.app.surMaj(afficherMaj);
window.app.majEtat().then(afficherMaj);

// Google a coupé la connexion (expirée, retirée, ou jamais faite) : on le dit et on propose de se reconnecter.
window.app.surDeconnexion(() => {
  if (vue === 'reglage' && $('go')) return; // déjà sur l'écran de connexion
  etat.connecte = false;
  ecranConnexion();
  erreur('Ta connexion Google a expiré ou a été retirée : reconnecte-toi');
});

// changer = true : un fichier est déjà relié ; il le reste tant que le nouveau n'est pas validé, et on peut revenir.
function ecranFichier(changer = false) {
  $('bas').classList.add('cache');
  afficher('reglage', `${illus('lien')}
    <p class="titre">${changer ? 'Changer de fichier' : 'Ton fichier des disques'}</p>
    <p class="texte">Colle le lien du Google Sheets (même vide) et ton prénom.</p>
    <input id="lien" placeholder="https://docs.google.com/spreadsheets/…">
    <input id="prenom" placeholder="Ton prénom" value="${echapper(etat.nom)}">
    ${boutons([['ok', null, "C'est parti"], ...(changer ? [['retour', 'retour', 'Retour à la liste', 'second']] : [])])}
    <button class="lien" id="compte" style="margin-top:10px">${ico('google')}Changer de compte Google</button>`);
  $('ok').onclick = async () => {
    $('ok').disabled = true;
    try {
      etat.titre = await window.app.choisirFichier($('lien').value.trim());
      etat.nom = $('prenom').value.trim();
      await window.app.nom(etat.nom);
      etat.sheetId = true;
      suivant();
    } catch (e) { if ($('ok')) $('ok').disabled = false; erreur(e.message); }
  };
  if (changer) $('retour').onclick = ecranListe;
  $('compte').onclick = () => ecranConnexion();
}

// Première clé, ou changement de clé depuis le bas de l'app. L'ancienne clé n'est jamais affichée :
// l'app la garde chiffrée et ne la renvoie pas à l'interface. La nouvelle est vérifiée auprès d'OpenAI avant d'être gardée.
function ecranCle(changer = false) {
  afficher('reglage', `${illus('cle')}
    <p class="titre">${changer ? 'Changer la clé OpenAI' : 'Dernière étape'}</p>
    <p class="texte">${changer
      ? "Colle la nouvelle clé. L'ancienne reste en place tant que la nouvelle n'a pas été acceptée par OpenAI."
      : "Colle la clé OpenAI. C'est à faire une seule fois."}</p>
    <input id="cle" type="password" placeholder="sk-…" autocomplete="off" spellcheck="false">
    ${boutons([['ok', null, 'Vérifier et enregistrer'], ...(changer ? [['retour', 'retour', 'Retour à la liste', 'second']] : [])])}`);
  const champ = $('cle');
  champ.focus();
  const valider = async () => {
    if ($('ok').disabled) return;
    $('ok').disabled = true;
    $('ok').textContent = 'Je vérifie la clé auprès d\'OpenAI…';
    erreur('');
    try {
      await window.app.cleOpenai(champ.value.trim());
      champ.value = '';
      etat.cleOpenai = true;
      await suivant();
      $('puce').innerHTML += '<span>· nouvelle clé OpenAI enregistrée</span>';
    } catch (e) {
      $('ok').disabled = false;
      $('ok').textContent = 'Vérifier et enregistrer';
      erreur(e.message);
    }
  };
  $('ok').onclick = valider;
  champ.onkeydown = (e) => { if (e.key === 'Enter') valider(); };
  if (changer) $('retour').onclick = ecranListe;
}

// ---------- Liste des disques ----------

async function ecranListe() {
  cible = null;
  window.app.liberer();
  $('bas').classList.remove('cache');
  $('puce').innerHTML = `<span class="point"></span><span>${echapper(etat.titre)}</span>`;
  afficher('chargement', `<div class="anneau"></div><p class="texte">Je lis le fichier…</p>`);
  try { rendreListe(await window.app.disques()); }
  catch (e) {
    // Connexion Google perdue : retour à l'écran de connexion, avec l'explication.
    if (!(await window.app.etatInitial()).connecte) {
      etat.connecte = false;
      $('bas').classList.add('cache');
      ecranConnexion();
    } else afficher('liste', '', false);
    erreur(e.message);
  }
}

// La liste se relit toute seule (toutes les 30 s et au retour sur la fenêtre) pour suivre les changements
// faits à la main dans le fichier ; elle n'est redessinée que si quelque chose a changé.
let derniereListe = [];
async function rafraichir() {
  if (vue !== 'liste' || document.hidden) return;
  try {
    const disques = await window.app.disques();
    if (vue === 'liste' && JSON.stringify(disques) !== JSON.stringify(derniereListe)) rendreListe(disques, false);
  } catch { /* hors ligne : on garde l'affichage actuel */ }
}
setInterval(rafraichir, 30000);
window.addEventListener('focus', rafraichir);

function rendreListe(disques, anime = true) {
  derniereListe = disques;
  const defile = ecran.querySelector('.choix')?.scrollTop || 0;
  const relies = disques.filter((d) => d.relie).length;
  const doubles = [...new Set(disques.filter((d) => d.doublon).map((d) => d.numero))];
  afficher('liste', `<div class="liste-tete"><b>Tes disques</b><span>${disques.length} au total · ${relies} reliés
      <button class="recharger" id="recharger" title="Recharger le fichier">${ico('sync')}Recharger</button></span></div>
    ${doubles.length ? `<div class="alerte">${ico('question')}<span><b>Numéros en double : ${doubles.map((n) => `n°${echapper(n)}`).join(', ')}</b>
      Plusieurs disques portent le même numéro. Touche l'un d'eux pour corriger, sinon ils ne pourront pas être synchronisés.</span></div>` : ''}
    <div class="choix">
      <button class="disque ajout" data-num="nouveau"><span class="num">${ico('plus')}</span>
        <span><span class="nom">Ajouter un disque</span><span class="sous" style="display:block;color:inherit;opacity:.8">Un SSD qui n'est pas encore dans le fichier</span></span></button>
      ${disques.map((c) => {
        const [fort, pale, texte] = teinte(c.pourcent);
        return `<button class="disque${c.doublon ? ' double' : ''}" data-num="${echapper(c.numero)}" data-ligne="${c.ligne}">
          <span class="num">${echapper(c.numero)}</span>
          <span style="min-width:0">
            <span class="nom">Disque ${echapper(c.numero)}${c.capacite ? ` <span style="color:var(--doux);font-weight:500">· ${echapper(c.capacite)} To</span>` : ''}${c.relie ? '<span class="relie" title="SSD relié"></span>' : ''}${c.doublon ? '<span class="badge-double">n° en double</span>' : ''}</span>
            <span class="sous" style="display:block">${echapper([c.localisation, c.projets].filter(Boolean).join(' · ') || 'Pas encore synchronisé')}</span>
          </span>
          ${c.pourcent ? `<span class="pct" style="background:${pale};color:${texte}">${echapper(c.pourcent)} %</span>` : '<span></span>'}
          ${c.pourcent ? `<span class="mini"><div style="width:${parseFloat(String(c.pourcent).replace(',', '.'))}%;background:${fort}"></div></span>` : ''}
        </button>`;
      }).join('')}
    </div>`, false);
  if (!anime) { ecran.firstElementChild.classList.remove('entre'); ecran.querySelector('.choix').scrollTop = defile; }
  $('recharger').onclick = async () => {
    $('recharger').classList.add('en-cours');
    try { rendreListe(await window.app.disques(), false); } catch (e) { $('recharger').classList.remove('en-cours'); erreur(e.message); }
  };
  ecran.querySelectorAll('.disque').forEach((b) => {
    b.onclick = () => (b.classList.contains('double') ? ecranDoublon(b.dataset.num, Number(b.dataset.ligne)) : ecranAttente(b.dataset.num));
  });
}

function ecranDoublon(numero, ligne) {
  afficher('doublon', `<div class="illus orange">${ico('question')}</div>
    <p class="titre">Plusieurs disques portent le n°${echapper(numero)}</p>
    <p class="texte">L'app ne peut pas savoir lequel remplir. Je peux donner à celui-ci le premier numéro libre :
      seule la case du numéro change, le reste de la ligne ne bouge pas.</p>
    ${boutons([['corriger', 'coche', 'Corriger automatiquement'], ['choisir', null, 'Choisir le numéro moi-même', 'second'],
    ['retour', 'retour', 'Retour à la liste', 'second']])}`);
  $('choisir').onclick = () => ecranNumero(ligne, numero);
  $('corriger').onclick = async () => {
    try {
      const nouveau = await window.app.renumeroter(ligne);
      await ecranListe();
      erreur('');
      $('puce').innerHTML += `<span>· disque renuméroté n°${echapper(nouveau)}</span>`;
    } catch (e) { erreur(e.message); }
  };
  $('retour').onclick = ecranListe;
}

// Changer le n° d'un disque : seule la case du n° change, le SSD reste relié à sa ligne.
function ecranNumero(ligne, ancien) {
  afficher('numero', `${illus('disque')}
    <p class="titre">Changer le n° du disque ${echapper(ancien)}</p>
    <p class="texte">Le SSD reste relié à cette ligne, seul le numéro change dans le fichier.</p>
    <input id="numero" value="${echapper(ancien)}" maxlength="20">
    ${boutons([['ok', 'coche', 'Enregistrer'], ['retour', 'retour', 'Retour à la liste', 'second']])}`);
  const champ = $('numero');
  champ.focus();
  champ.select();
  const enregistrer = async () => {
    $('ok').disabled = true;
    try {
      const nouveau = await window.app.changerNumero(ligne, ancien, champ.value.trim());
      await ecranListe();
      $('puce').innerHTML += `<span>· disque ${echapper(ancien)} → n°${echapper(nouveau)}</span>`;
    } catch (e) { $('ok').disabled = false; erreur(e.message); }
  };
  $('ok').onclick = enregistrer;
  champ.onkeydown = (e) => { if (e.key === 'Enter') enregistrer(); };

}

// ---------- Branchement et synchronisation ----------

async function ecranAttente(numero) {
  cible = numero;
  const nouveau = numero === 'nouveau';
  // Rappel de ce qu'il y a sur le disque attendu, pour prendre le bon SSD sur l'étagère.
  const info = derniereListe.find((d) => d.numero === numero);
  const rappel = info ? [info.capacite && `${info.capacite} To`, info.localisation, info.projets].filter(Boolean).join(' · ') : '';
  afficher('attente', `<div class="illus onde"><span class="flotte" style="display:grid">${ico('prise')}</span></div>
    <p class="titre">${nouveau ? 'Branche le nouveau disque' : `Branche le disque n°${echapper(numero)}`}</p>
    ${rappel ? `<p class="rappel">${echapper(rappel)}</p>` : ''}
    <p class="texte">J'attends qu'il apparaisse sur l'ordinateur</p>
    <div class="points"><i></i><i></i><i></i></div>
    ${boutons([['retour', 'retour', 'Retour à la liste', 'second'], ...(info ? [['changer', null, 'Changer le n° de ce disque', 'second']] : [])])}`);
  $('retour').onclick = ecranListe;
  if (info) $('changer').onclick = () => ecranNumero(info.ligne, info.numero);
  const deja = await window.app.attendre(numero);
  if (deja && vue === 'attente') surSsd(deja);
}

function surSsd(b) {
  if (!['attente', 'liste'].includes(vue)) return;
  if (vue === 'liste') cible = b.numero || 'nouveau';
  if (b.numero && cible !== 'nouveau' && b.numero !== cible) return ecranAutre(b);
  if (b.numero || cible !== 'nouveau') return ecranPret(b, b.numero || cible);
  ecranNouveau(b);
}

async function ecranPret(b, numero) {
  afficher('verif', `<div class="anneau"></div><p class="texte">Je vérifie que c'est le bon disque…</p>`);
  let v = { autre: null, ecart: null };
  try { v = await window.app.verifier(numero); } catch (e) { return ecranListe().then(() => erreur(e.message)); }
  if (vue !== 'verif') return;

  // Ce n° est déjà relié à un autre SSD : on n'écrase pas le lien sans le dire.
  if (v.autre) {
    afficher('pret', `<div class="illus orange">${ico('question')}</div>
      <p class="titre">Ce n'est probablement pas le bon SSD</p>
      <p class="texte">Le disque n°${echapper(numero)} est déjà relié à un autre SSD
        (${echapper(v.autre.modele || 'modèle inconnu')}${v.autre.date ? `, relié le ${echapper(v.autre.date)}` : ''}).<br>
        Le SSD branché est un ${echapper(b.disque.modele)} de ${fr(b.disque.total_to)} To.</p>
      ${boutons([['retour', 'retour', 'Retour à la liste'], ['forcer', 'sync', 'Remplacer quand même', 'second']])}
      <p class="texte" style="font-size:12px;margin-top:10px">« Remplacer » sert seulement si le SSD du disque n°${echapper(numero)} a vraiment été changé.</p>`);
    $('forcer').onclick = () => travailler(() => window.app.synchroniser(numero, true));
    $('retour').onclick = ecranListe;
    return;
  }

  afficher('pret', `${illus('disque', v.ecart ? 'orange' : 'vert')}
    <p class="titre">Disque n°${echapper(numero)} branché</p>
    <p class="texte">${echapper(b.disque.modele)} · ${fr(b.disque.total_to)} To</p>
    ${v.ecart ? `<div class="alerte" style="margin-top:14px;text-align:left">${ico('question')}<span><b>La capacité ne correspond pas</b>
      Ce SSD fait ${fr(v.ecart.mesure)} To, mais le disque n°${echapper(numero)} fait ${fr(v.ecart.fichier)} To dans le fichier. Vérifie que c'est le bon.</span></div>` : ''}
    ${stats(b.disque)}
    ${boutons([['sync', 'sync', v.ecart ? 'Synchroniser quand même' : 'Synchroniser avec le Drive', v.ecart ? 'second' : ''],
    ['retour', 'retour', 'Retour à la liste', v.ecart ? '' : 'second']])}`);
  $('sync').onclick = () => travailler(() => window.app.synchroniser(numero));
  $('retour').onclick = ecranListe;
}

// Nouveau SSD : le n° écrit dans son nom (« SSD 12 ») est proposé, sinon il va à la suite des autres.
async function ecranNouveau(b) {
  afficher('nouveau', `<div class="anneau"></div><p class="texte">Je regarde le nom du SSD…</p>`);
  let p = null;
  try { p = await window.app.proposition(); } catch (e) { erreur(e.message); }
  if (vue !== 'nouveau') return;

  const n = p?.numeroNom;
  const occ = p?.occupant;
  const alerte = (titre, texte) => `<div class="alerte" style="margin-top:14px;text-align:left">${ico('question')}<span><b>${titre}</b>${texte}</span></div>`;
  const note = (t) => `<p class="texte" style="margin-top:12px">${t}</p>`;
  const suite = ['suite', 'plus', p ? `Ajouter à la suite des autres (n°${echapper(p.suite)})` : 'Ajouter à la suite des autres'];
  const retour = ['retour', 'retour', 'Retour à la liste', 'second'];
  let milieu;
  let liste;
  if (!n) {
    milieu = note('Pas de numéro dans son nom : il sera ajouté à la suite des autres.');
    liste = [suite, retour];
  } else if (!occ) {
    milieu = note(`Son nom indique le n°${echapper(n)}.`);
    liste = [['nom', 'coche', `Ajouter comme disque n°${echapper(n)}`], [...suite, 'second'], retour];
  } else if (occ.etat === 'non-relie') {
    const rappel = [occ.capacite && `${occ.capacite} To`, occ.localisation, occ.projets].filter(Boolean).join(' · ');
    milieu = alerte(`Le disque n°${echapper(n)} existe déjà dans le fichier`,
      `${rappel ? `${echapper(rappel)}. ` : ''}Il n'est relié à aucun SSD : c'est sûrement celui-ci.`);
    liste = [['relier', 'lien', `C'est lui : relier au disque n°${echapper(n)}`], [...suite, 'second'], retour];
  } else if (occ.etat === 'autre-ssd') {
    milieu = alerte(`Le n°${echapper(n)} est déjà pris par un autre SSD`,
      `${echapper(occ.modele || 'Modèle inconnu')}${occ.date ? `, relié le ${echapper(occ.date)}` : ''}. Si tu donnes le n°${echapper(n)} à celui-ci,
      l'autre passe en n°${echapper(p.suite)} (sa ligne et ses infos ne bougent pas).`);
    liste = [['prendre', 'coche', `Lui donner le n°${echapper(n)} (l'autre passe en n°${echapper(p.suite)})`], [...suite, 'second'], retour];
  } else {
    milieu = alerte(`Plusieurs disques portent déjà le n°${echapper(n)}`, 'Corrige-les depuis la liste, ou ajoute celui-ci à la suite des autres.');
    liste = [suite, retour];
  }

  afficher('nouveau', `${illus('nouveau')}
    <p class="titre">Nouveau disque détecté</p>
    <p class="texte">${echapper(b.disque.modele)} · ${fr(b.disque.total_to)} To${p?.nom ? `<br>Nom du SSD : <b style="color:var(--texte)">${echapper(p.nom)}</b>` : ''}</p>
    ${milieu}
    ${stats(b.disque)}
    ${boutons(liste)}`);
  $('suite').onclick = () => travailler(() => window.app.ajouter());
  if ($('nom')) $('nom').onclick = () => travailler(() => window.app.ajouter({ numero: n }));
  if ($('prendre')) $('prendre').onclick = () => travailler(() => window.app.ajouter({ numero: n, prendre: true }));
  if ($('relier')) $('relier').onclick = () => ecranPret(b, n);
  $('retour').onclick = ecranListe;
}

function ecranAutre(b) {
  afficher('pret', `${illus('question')}
    <p class="titre">Ce SSD est le disque n°${echapper(b.numero)}</p>
    <p class="texte">Tu attendais le n°${echapper(cible)}. Tu veux synchroniser le n°${echapper(b.numero)} ?</p>
    ${boutons([['sync', 'sync', `Synchroniser le n°${echapper(b.numero)}`], ['retour', 'retour', 'Retour à la liste', 'second']])}`);
  $('sync').onclick = () => travailler(() => window.app.synchroniser(b.numero));
  $('retour').onclick = ecranListe;
}

window.app.surProgres((m) => { if (vue === 'travail' && $('progres')) $('progres').textContent = m; });

// Contenu proposé par l'IA et doublons trouvés, sous le résultat de la synchronisation.
function blocsAnalyse(a, numero) {
  if (!a) return '';
  if (a.erreur) return `<div class="bloc"><b>Lecture des fichiers impossible</b>${echapper(a.erreur)}</div>`;
  let html = '';
  if (a.contenu) {
    html += `<div class="bloc"><b>${a.contenu.ecrit ? 'Contenu rempli' : 'Contenu proposé (la case était déjà remplie, je n\'y ai pas touché)'}</b>
      <span class="extrait">${echapper(a.contenu.texte)}</span>
      ${a.contenu.ecrit ? '' : '<button class="lien" id="remplacer">Remplacer la case Contenu par ce texte</button>'}</div>`;
  } else if (a.contenuErreur) {
    html += `<div class="bloc"><b>Contenu non rempli</b>${echapper(a.contenuErreur)}</div>`;
  }
  const d = a.doublons;
  if (d) {
    const rien = !d.memeSsd && !d.autresSsd;
    html += `<div class="bloc"><b>${rien ? 'Aucun doublon' : `Doublons : ${fr(d.perduGo)} Go en trop`}</b>
      ${rien ? `${a.fichiers.toLocaleString('fr-FR')} fichiers lus, aucun n'est en double.`
        : [d.memeSsd && `${d.memeSsd} fichier${d.memeSsd > 1 ? 's' : ''} en double dans ce disque`,
          d.autresSsd && `${d.autresSsd} fichier${d.autresSsd > 1 ? 's' : ''} aussi sur ${d.avec.length > 1 ? 'les disques' : 'le disque'} ${d.avec.map((n) => `n°${echapper(n)}`).join(', ')}`]
          .filter(Boolean).join(' · ')}
      ${d.total ? '<button class="lien" id="voir-doublons">Voir tous les doublons dans le fichier</button>' : ''}</div>`;
  } else if (a.doublonsErreur) {
    html += `<div class="bloc"><b>Doublons non vérifiés</b>${echapper(a.doublonsErreur)}</div>`;
  }
  return html;
}

async function travailler(action) {
  afficher('travail', `<div class="anneau"></div><p class="titre">Je remplis le fichier</p><p class="texte" id="progres">Ça prend quelques secondes</p>`);
  try {
    const r = await action();
    afficher('fini', `<div class="illus vert">${ico('coche', 'coche')}</div>
      <p class="titre">Disque n°${echapper(r.numero)} synchronisé</p>
      <p class="texte">${r.ecrits.length ? `Mis à jour : ${r.ecrits.map(echapper).join(', ')}` : "Rien n'avait changé"}<br>Une ligne a été ajoutée dans les emprunts.${r.deplace
        ? `<br>Le disque qui avait le n°${echapper(r.deplace.de)} est passé en n°${echapper(r.deplace.vers)}.` : ''}</p>
      ${blocsAnalyse(r.analyse, r.numero)}
      ${boutons([['retour', 'retour', 'Retour à la liste'], ['ouvrir', 'fichier', 'Voir le fichier', 'second']])}`);
    $('ouvrir').onclick = () => window.app.ouvrirFichier();
    $('retour').onclick = ecranListe;
    if ($('voir-doublons')) $('voir-doublons').onclick = () => window.app.ouvrirDoublons();
    if ($('remplacer')) {
      $('remplacer').onclick = async () => {
        try {
          await window.app.ecrireContenu(r.numero, r.analyse.contenu.texte);
          $('remplacer').outerHTML = '<span style="display:block;padding-top:6px;color:var(--vert);font-weight:600">Case Contenu remplacée</span>';
        } catch (e) { erreur(e.message); }
      };
    }
  } catch (e) {
    await ecranListe();
    erreur(e.message);
  }
}

window.app.surSsd(surSsd);
window.app.surRetrait(() => {
  if (['pret', 'nouveau', 'verif'].includes(vue)) { ecranAttente(cible); erreur('Le SSD a été débranché'); }
});
window.app.surErreur(erreur);

function suivant() {
  if (!etat.connecte) return ecranConnexion();
  if (!etat.sheetId) return ecranFichier();
  if (!etat.cleOpenai) return ecranCle();
  ecranListe();
}

$('btn-ouvrir').innerHTML = `${ico('fichier')}Ouvrir le fichier`;
$('btn-changer').innerHTML = `${ico('reglage')}Changer de fichier`;
$('btn-cle').innerHTML = `${ico('cle')}Clé OpenAI`;
$('btn-cle').onclick = () => ecranCle(true);
$('btn-ouvrir').onclick = () => window.app.ouvrirFichier();
// L'ancien fichier reste relié tant que le nouveau n'a pas été validé.
$('btn-changer').onclick = () => ecranFichier(true);
window.app.etatInitial().then((e) => { etat = e; suivant(); });
</script>
</body>
</html>
