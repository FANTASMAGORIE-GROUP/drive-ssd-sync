<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="fond" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFC4CF"/>
      <stop offset="0.55" stop-color="#FF8FA3"/>
      <stop offset="1" stop-color="#EE5C7E"/>
    </linearGradient>
    <linearGradient id="reflet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".4"/>
      <stop offset=".55" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="corps" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#55406A"/>
      <stop offset="1" stop-color="#3A2A4A"/>
    </linearGradient>
    <linearGradient id="badge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7EE0B8"/>
      <stop offset="1" stop-color="#3FB489"/>
    </linearGradient>
    <filter id="ombre" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="22" stdDeviation="26" flood-color="#8A2443" flood-opacity=".35"/>
    </filter>
  </defs>

  <!-- Fond arrondi -->
  <rect x="32" y="32" width="960" height="960" rx="220" fill="url(#fond)"/>
  <rect x="32" y="32" width="960" height="960" rx="220" fill="url(#reflet)"/>

  <!-- Le SSD -->
  <g filter="url(#ombre)">
    <rect x="232" y="292" width="560" height="470" rx="104" fill="url(#corps)"/>
    <!-- étiquette -->
    <rect x="292" y="350" width="440" height="128" rx="40" fill="#FFF7F2"/>
    <rect x="336" y="394" width="190" height="16" rx="8" fill="#FF8FA3"/>
    <rect x="336" y="424" width="120" height="16" rx="8" fill="#F3D9D0"/>
    <!-- visage -->
    <ellipse cx="420" cy="590" rx="34" ry="40" fill="#FFF7F2"/>
    <ellipse cx="604" cy="590" rx="34" ry="40" fill="#FFF7F2"/>
    <circle cx="428" cy="598" r="17" fill="#2A1F35"/>
    <circle cx="612" cy="598" r="17" fill="#2A1F35"/>
    <circle cx="434" cy="590" r="6" fill="#fff"/>
    <circle cx="618" cy="590" r="6" fill="#fff"/>
    <ellipse cx="352" cy="652" rx="34" ry="20" fill="#FF8FA3" opacity=".75"/>
    <ellipse cx="672" cy="652" rx="34" ry="20" fill="#FF8FA3" opacity=".75"/>
    <path d="M478 660 Q512 692 546 660" fill="none" stroke="#FFF7F2" stroke-width="16" stroke-linecap="round"/>
  </g>

  <!-- Badge de synchronisation -->
  <g transform="translate(768 290)">
    <circle r="138" fill="#fff"/>
    <circle r="118" fill="url(#badge)"/>
    <g fill="none" stroke="#fff" stroke-width="24" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-60 0 A60 60 0 0 1 42.4 -42.4"/>
      <polyline points="8,-45 42.4,-42.4 39,-76"/>
      <g transform="rotate(180)">
        <path d="M-60 0 A60 60 0 0 1 42.4 -42.4"/>
        <polyline points="8,-45 42.4,-42.4 39,-76"/>
      </g>
    </g>
  </g>
</svg>
