<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Télécharger SSD Drive Sync</title>
<link rel="icon" href="logo.svg">
<style>
  :root { --fond: #fff6f1; --carte: #fff; --texte: #2e2333; --doux: #8f7c84; --rose: #ff7f98; --rose-fonce: #ec5577; --fond-2: #ffece6; }
  @media (prefers-color-scheme: dark) { :root { --fond: #1c1621; --carte: #2a2131; --texte: #f6eef2; --doux: #a8949f; --fond-2: #241c2a; } }
  * { box-sizing: border-box; margin: 0; }
  body { min-height: 100vh; display: grid; place-items: center; padding: 16px; font-family: "Segoe UI", -apple-system, system-ui, sans-serif;
    background: radial-gradient(120% 70% at 50% -10%, var(--fond-2), var(--fond) 60%); color: var(--texte); }
  main { background: var(--carte); border-radius: 24px; padding: 36px 28px; max-width: 420px; width: 100%; text-align: center;
    box-shadow: 0 1px 2px rgba(74, 55, 88, .06), 0 18px 40px rgba(236, 85, 119, .15); }
  img { width: 96px; height: 96px; margin-bottom: 14px; }
  h1 { font-size: 22px; margin-bottom: 6px; }
  p { color: var(--doux); line-height: 1.5; font-size: 14px; }
  a.bouton { display: block; margin-top: 22px; padding: 14px; border-radius: 14px; color: #fff; text-decoration: none; font-weight: 600;
    background: linear-gradient(180deg, var(--rose), var(--rose-fonce)); box-shadow: 0 6px 16px rgba(236, 85, 119, .3); }
  .autre { margin-top: 14px; font-size: 13px; }
  .autre a { color: var(--rose-fonce); }
  .aide { margin-top: 18px; font-size: 12.5px; text-align: left; background: var(--fond-2); padding: 12px 14px; border-radius: 12px; }
</style>
</head>
<body>
<main>
  <img src="logo.svg" alt="">
  <h1>SSD Drive Sync</h1>
  <p id="etat">Le téléchargement va commencer…</p>
  <a class="bouton" id="bouton" href="#">Télécharger</a>
  <p class="autre" id="autre"></p>
  <p class="aide" id="aide"></p>
</main>
<script>
  // Liens permanents : ils pointent toujours vers la dernière version publiée.
  const BASE = 'https://github.com/FANTASMAGORIE-GROUP/drive-ssd-sync/releases/latest/download/';
  const MAC = { nom: 'Mac', fichier: BASE + 'SSD-Drive-Sync-Mac.dmg',
    aide: 'Ouvre le fichier téléchargé, glisse l\'app dans <b>Applications</b>. Au premier lancement : <b>clic droit sur l\'app → Ouvrir</b>.' };
  const WIN = { nom: 'Windows', fichier: BASE + 'SSD-Drive-Sync-Windows.exe',
    aide: 'Ouvre le fichier téléchargé. Si Windows affiche un avertissement : <b>Informations complémentaires → Exécuter quand même</b>.' };
  const plateforme = (navigator.userAgentData && navigator.userAgentData.platform) || navigator.platform || navigator.userAgent;
  const estMac = /mac|iphone|ipad/i.test(plateforme);
  const estWin = /win/i.test(plateforme);
  const choisi = estMac ? MAC : WIN;
  const autre = estMac ? WIN : MAC;
  document.getElementById('bouton').href = choisi.fichier;
  document.getElementById('bouton').textContent = `Télécharger pour ${choisi.nom}`;
  document.getElementById('autre').innerHTML = `Pas sur ${choisi.nom} ? <a href="${autre.fichier}">Version ${autre.nom}</a>`;
  document.getElementById('aide').innerHTML = choisi.aide;
  if (estMac || estWin) {
    document.getElementById('etat').textContent = `Le téléchargement pour ${choisi.nom} va commencer…`;
    setTimeout(() => { window.location.href = choisi.fichier; }, 800);
  } else {
    document.getElementById('etat').textContent = 'Choisis ta version :';
  }
</script>
</body>
</html>
